<mat-grid-list cols="10" rowHeight="250px" gutterSize="1rem">
  <mat-grid-tile [colspan]="3">
    <img ngSrc="images/home/cellar.webp" height="310" width="250" alt="Grupo de amigos brindando" />
    <div>
      <h4>Vinos de la casa</h4>
    </div>
  </mat-grid-tile>
  <mat-grid-tile [colspan]="7">
    <img ngSrc="images/home/traditional_food.webp" height="320" width="480" alt="Ingredientes típicos de la comida mediterránea" />
    <div>
      <h4>Disfruta de la comida mediterránea</h4>
    </div>
  </mat-grid-tile>
  <mat-grid-tile [colspan]="4">
    <img ngSrc="images/home/fresh_ingredients.webp" height="320" width="480" alt="Varios utensilios de cocina" />
    <div>
      <h4>Ingredientes frescos</h4>
    </div>
  </mat-grid-tile>

  <mat-grid-tile [colspan]="6">
    <img ngSrc="images/home/no_waiting_times.webp" height="721" width="1280" alt="Restaurante cálido con varios mesas" />
    <div>
      <h4>Esperas reducidas</h4>
    </div>
  </mat-grid-tile>
</mat-grid-list>
