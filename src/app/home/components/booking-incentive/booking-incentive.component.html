<section class="booking-incentive">
  <small>Una invitación</small>
  <h3>Únete a nosotros</h3>
  <p>
    Solo tienes que rellenar el formulario a continuación y podrás disfrutar de las ventajas de ser
    parte de nuestra comunidad.
  </p>
  <form (submit)="onFormSubmit($event)">
    <mat-form-field class="date-picker booking-incentive-date">
      <input
        matInput
        [min]="minDate"
        [matDatepicker]="datePicker"
        [formField]="bookingIncentiveForm.date"
        [placeholder]="'date.select' | transloco"
      />
      <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-datepicker #datePicker></mat-datepicker>
    </mat-form-field>
    <div class="separator"></div>
    <mat-form-field class="booking-incentive-guests">
      <mat-select [formField]="bookingIncentiveForm.guests">
        @for (guest of guests; track guest) {
          <mat-option [value]="guest.value">{{ guest.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <button type="submit">Reservar mesa</button>
  </form>
</section>
