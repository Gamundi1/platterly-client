<fieldset>
  <legend id="drinks-list-legend">
    <span class="title">{{ 'drinks_title' | transloco }}</span>
  </legend>
  <section class="drinks-list" aria-labelledby="drinks-list-legend">
    @for (drink of drinks(); track drink.id) {
      <div
        tabindex="0"
        class="drink"
        aria-label="plato de {{ drink.name | transloco }}"
        (click)="deleteDrink(drink.id)"
      >
        <span class="name">{{ drink.name | transloco }}</span>
        <span class="alcoholic">{{
          drink.isAlcoholic ? 'contains_alcohol' : ('does_not_contain_alcohol' | transloco)
        }}</span>
        <span class="price">{{ drink.price | currency: 'EUR' }}</span>
      </div>
    }
  </section>
  <button type="button" (click)="openAddProductModal()">
    <mat-icon>add</mat-icon>
    <span>Añadir bebida</span>
  </button>
</fieldset>
