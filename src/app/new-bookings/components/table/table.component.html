<section>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" [style.--legend-option-color]="'var(--secondary-color)'"></div>
      <span class="legend-text">No Disponible</span>
    </div>
    <div class="legend-item">
      <div
        class="legend-color"
        [style.--legend-option-color]="'oklch(from var(--secondary-color) 0.6 c h)'"
      ></div>
      <span class="legend-text">Disponible</span>
    </div>
    <div class="legend-item">
      <div class="legend-color"></div>
      <span class="legend-text">Seleccionada</span>
    </div>
  </div>
  <div class="separator"></div>
  <div class="top-layer">
    <span class="restaurant-constant"><fa-icon [icon]="faToilet"></fa-icon></span>
    <span class="restaurant-constant kitchen"><fa-icon [icon]="faKitchen"></fa-icon></span>
  </div>
  <div
    class="table-map"
    aria-label="Mapa de mesas en el restaurante"
    [style.--inline-tracks]="inlineTrackCount()"
    [style.--block-tracks]="blockTrackCount()"
  >
    @for (table of tables(); track table.number) {
      <button
        class="table"
        type="button"
        [style.grid-column]="getInlineTrack(table)"
        [style.grid-row]="getBlockTrack(table)"
        [attr.aria-label]="'Mesa ' + table.number + ', capacidad ' + table.capacity"
        [attr.aria-selected]="table.number === currentSelectedTable()?.number"
        [disabled]="!isTableAvailable(table)"
        (click)="onTableClick(table)"
      >
        <fa-icon [icon]="faUser"></fa-icon>
        <span>
          {{ table.capacity }}
        </span>
      </button>
    }
  </div>
  <span class="restaurant-constant">entrada</span>
  @if (!selectedHour()) {
    <div class="overlay">
      <span>Selecciona un horario para ver las mesas disponibles</span>
    </div>
  }
</section>
