<section>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" [style.--legend-option-color]="'var(--secondary-color)'"></div>
      <span class="legend-text">No Disponible</span>
    </div>
    <div class="legend-item">
      <div
        class="legend-color"
        [style.--legend-option-color]="'oklch(from var(--secondary-color) 0.6 c h)'"
      ></div>
      <span class="legend-text">Disponible</span>
    </div>
    <div class="legend-item">
      <div class="legend-color"></div>
      <span class="legend-text">Seleccionada</span>
    </div>
  </div>
  <div class="separator"></div>
  <div class="top-layer">
    <span class="restaurant-constant">Baño</span>
    <span class="restaurant-constant kitchen">Cocina</span>
  </div>
  <div
    role="grid"
    class="table-map"
    aria-label="Mapa de mesas en el restaurante"
    [attr.aria-rowcount]="blockTrackCount()"
    [attr.aria-colcount]="inlineTrackCount()"
    [style.--inline-tracks]="inlineTrackCount()"
    [style.--block-tracks]="blockTrackCount()"
  >
    @for (row of tableRows(); track row.row) {
      <div role="row" class="table-row" [attr.aria-rowindex]="row.row">
        @for (table of row.tables; track table.number) {
          @let available = isTableAvailable(table);
          <button
            role="gridcell"
            class="table"
            [style.grid-column]="getInlineTrack(table)"
            [style.grid-row]="getBlockTrack(table)"
            [attr.data-tn]="table.number"
            #tableButton
            type="button"
            [attr.aria-label]="'Mesa ' + table.number + ', capacidad ' + table.capacity"
            [attr.aria-selected]="table.number === currentSelectedTable()?.number"
            [attr.aria-disabled]="!available"
            (click)="available ? onTableClick(table) : null"
            (focus)="focusedTable.set(table)"
            [tabindex]="isTableFocusable(table) ? 0 : -1"
          >
            <fa-icon [icon]="faUser"></fa-icon>
            <span>
              {{ table.capacity }}
            </span>
          </button>
        }
      </div>
    }
  </div>
  <span class="restaurant-constant">entrada</span>
  @if (!selectedHour()) {
    <div class="overlay">
      <span>Selecciona un horario para ver las mesas disponibles</span>
    </div>
  }
</section>
