<article>
  @let config = data.configuration;
  <img src="images/login/login-table.webp" alt="" />
  <form action="" (submit)="submitLogin($event)">
    <button type="button" class="close-button" mat-dialog-close>
      <fa-icon [icon]="faXMark"></fa-icon>
    </button>
    <div class="title">
      <h2>{{ config.title }}</h2>
      <span>{{ config.subtitle }}</span>
    </div>
    @if (invalidCredentials()) {
      <div class="invalid-data">
        <fa-icon [icon]="faTriangleExclamation"></fa-icon>
        Los datos introducidos son incorrectos.
      </div>
    }

    <shared-input
      label="Email"
      [field]="loginForm.email"
      errorMessage="por favor introduce un email válido"
    ></shared-input>

    <shared-input
      label="Contraseña"
      [field]="loginForm.password"
      type="password"
      errorMessage="la contraseña debe tener almenos 8 carácteres"
    ></shared-input>

    <button class="submit-button" type="submit">{{ config.loginButtonLabel }}</button>
    <p>No tienes una cuenta? <a href="/register">Regístrate aquí</a></p>
  </form>
</article>
